# Release builds for all three platforms.
#
# Fires on v* tags (standalone-v* tags do not match and are ignored) and
# on manual dispatch, which builds everything and uploads workflow
# artifacts without touching a release. Use that as the dry run.
# Dispatch manually with: gh workflow run release.yml
#
# Linux runs on ubuntu-24.04 ON PURPOSE: the runner's glibc (2.39) is
# the compatibility floor of the shipped binaries (Ubuntu 24.04+,
# Debian 13+, RHEL 10+). Moving to a newer image silently raises that
# floor. See packaging/README.adoc, "Floors".
#
# macOS and Windows go through tauri-action (Tauri's bundler is fine
# there, while Linux packaging lives in packaging/). Neither platform
# is code-signed, and no signing env is wired: referencing undefined
# secrets sets empty variables, which the bundler treats as configured
# signing and then fails on (observed in the first dry run). In the
# event signing material ever exists, add the APPLE_* variables from
# tauri-action's docs to the macos job env.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-bin desktop-file-utils appstream libxml2-utils rpm

      - name: Install frontend dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          ver="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match app version $ver" >&2
            exit 1
          fi

      - name: Build
        run: pnpm exec vp run tauri build

      - name: Package (tarball, deb, rpm)
        run: |
          ./packaging/stage.sh
          ver="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          tar -cJf "dist/skrivro-${ver}-linux-x86_64.tar.xz" -C dist/stage .
          ./packaging/debian/build.sh
          ./packaging/rpm/build.sh

      - name: Upload workflow artifacts (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/skrivro-*-linux-x86_64.tar.xz
            dist/skrivro_*_amd64.deb
            dist/skrivro-*.x86_64.rpm

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/skrivro-*-linux-x86_64.tar.xz
            dist/skrivro_*_amd64.deb
            dist/skrivro-*.x86_64.rpm

  macos:
    runs-on: macos-latest # arm64, the app is Apple Silicon only
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          args: --target aarch64-apple-darwin

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
