[package]
name = "skrivro"
version = "0.1.0"
edition = "2021"
license = "0BSD"

[lib]
name = "skrivro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` enables Tauri's asset:// protocol handler so the webview
# can load local files via convertFileSrc(). Required by tauri.conf.json's
# `app.security.assetProtocol.enable = true` — the config alone isn't
# enough; Tauri's build-time feature allowlist check fails without this
# cargo feature on the `tauri` crate itself. We use it in the frontend's
# image post-processing path to rewrite Asciidoctor's relative image src
# paths into URLs the webview can actually load (which would otherwise
# hit the SPA-fallback trap of `tauri://localhost/`).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
# tauri-plugin-single-instance: enforces one PID per Skrivro launch on
# Linux and Windows (macOS already enforces this at the OS level for
# .app bundles). When a second `skrivro foo.adoc` is launched, the
# plugin intercepts: the second process sends its argv + cwd to the
# first running instance via IPC and then exits, and the first
# instance's callback routes the file path through the same
# PendingOpens + skrivro:open-file emit pipeline that file
# associations use. Net effect: "open another .adoc while Skrivro is
# running" routes to the existing window on all three platforms
# instead of spawning a second instance on Linux/Windows.
tauri-plugin-single-instance = "2"
# tauri-plugin-window-state: first-party Tauri plugin that persists
# window size, position, maximized state, and fullscreen state across
# launches. Saves state on close/resize/move events to a JSON file in
# the app's config dir, restores via WindowExt::restore_state at setup.
# No frontend integration needed for the auto-save/restore flow; the
# only code-side wiring is the .plugin() registration in the Builder
# and the .restore_state() call after window construction in setup().
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS-only dependencies. `objc2` and `objc2-app-kit` power direct Cocoa
# calls we use to hide standard window chrome while keeping the NSWindow
# style mask bits intact (Ghostty's pattern for "borderless-looking but
# with native AppKit integration"). See the hide_macos_chrome function
# in lib.rs for the full rationale. objc2 is already pulled in
# transitively on Mac via muda; declaring it directly lets us `use`
# the bindings from our own source.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# Linux-only dependencies. All already present in the transitive tree via
# wry/gtk/webkit2gtk, declared directly here so we can `use` them from our
# own source.
[target.'cfg(target_os = "linux")'.dependencies]
# webkit2gtk: used by the .setup() hook in lib.rs to filter the GTK-inherited
# "Insert Unicode Control Character" submenu out of the right-click context
# menu. Caret-semver ("2") deliberately matches whatever 2.x version wry
# already pulls in transitively, so Cargo unifies them and we don't end up
# with two copies of the crate compiled into the binary. If a future Tauri
# bump moves wry to webkit2gtk 3.x, this needs to become "3" and the
# ContextMenu API may need re-verification.
webkit2gtk = "2"
# glib: used by lib.rs::run() to call glib::set_prgname() early, as a
# workaround for a Wayland app_id propagation bug in tao's GTK backend.
# See the prgname-setting block at the top of run() in lib.rs for the
# full rationale. Version "0.18" matches what gtk 0.18.x already pulls
# in transitively, so Cargo unifies the crate.
glib = "0.18"
