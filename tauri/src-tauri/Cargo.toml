[package]
name = "skrivro"
version = "0.1.0"
edition = "2021"

[lib]
name = "skrivro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` enables Tauri's asset:// protocol handler so the webview
# can load local files via convertFileSrc(). Required by tauri.conf.json's
# `app.security.assetProtocol.enable = true` — the config alone isn't
# enough; Tauri's build-time feature allowlist check fails without this
# cargo feature on the `tauri` crate itself. We use it in the frontend's
# image post-processing path to rewrite Asciidoctor's relative image src
# paths into URLs the webview can actually load (which would otherwise
# hit the SPA-fallback trap of `tauri://localhost/`).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux-only dependencies. All already present in the transitive tree via
# wry/gtk/webkit2gtk, declared directly here so we can `use` them from our
# own source.
[target.'cfg(target_os = "linux")'.dependencies]
# webkit2gtk: used by the .setup() hook in lib.rs to filter the GTK-inherited
# "Insert Unicode Control Character" submenu out of the right-click context
# menu. Caret-semver ("2") deliberately matches whatever 2.x version wry
# already pulls in transitively, so Cargo unifies them and we don't end up
# with two copies of the crate compiled into the binary. If a future Tauri
# bump moves wry to webkit2gtk 3.x, this needs to become "3" and the
# ContextMenu API may need re-verification.
webkit2gtk = "2"
# glib: used by lib.rs::run() to call glib::set_prgname() early, as a
# workaround for a Wayland app_id propagation bug in tao's GTK backend.
# See the prgname-setting block at the top of run() in lib.rs for the
# full rationale. Version "0.18" matches what gtk 0.18.x already pulls
# in transitively, so Cargo unifies the crate.
glib = "0.18"
