[package]
name = "klartext"
version = "0.1.0"
edition = "2021"

[lib]
name = "klartext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux-only: webkit2gtk crate, used by the .setup() hook in lib.rs to filter
# the GTK-inherited "Insert Unicode Control Character" submenu out of the
# right-click context menu. Caret-semver ("2") deliberately matches whatever
# 2.x version wry already pulls in transitively, so Cargo unifies them and
# we don't end up with two copies of the crate compiled into the binary.
# If a future Tauri bump moves wry to webkit2gtk 3.x, this needs to become
# "3" and the ContextMenu API may need re-verification.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"
